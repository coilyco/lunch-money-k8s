[project]
name = "lunch-money-k8s"
version = "0.1.0"
description = "MCP server for the Lunch Money API, containerized and served over streamable HTTP."
license = "AGPL-3.0-only"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27",
    "boto3>=1.34",
    "pyyaml>=6.0",
    "sentry-sdk>=2.0,<3",
]

[project.scripts]
lunch-money-mcp = "lunch_money_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lunch_money_mcp"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.agentic-os.code-comments]
# YAML enforcement landed at agentic-os v0.14.0, tree cleaned at v0.16.0 (#17). The
# only exclude is the managed-hooks marker file: its BEGIN/END comments are structural,
# required by apply-agentic-os-hooks.py at fixed positions, so they cannot move to
# line 1. agentic-os excludes its own .pre-commit-config.yaml for the same reason.
excludes = [
    ".pre-commit-config.yaml",
]

[tool.agentic-os.repo-pointer-skills]
# Every fleet repo lives under the coilyco org.
org = "coilyco"

[tool.agentic-os.documentation-layout]
band = "small"
